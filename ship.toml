version = "package.json"
tag = "v<version>"
branch = "main"
check = "bun run check"
signed = false

[channels.github-release]
build = "bash scripts/build-release.sh"
assemble = "cp scripts/install.sh dist/install.sh && cd dist && shasum -a 256 -- agent-task-*.tar.gz install.sh >SHA256SUMS.txt"
files = [
  "dist/agent-task-darwin-arm64.tar.gz",
  "dist/agent-task-darwin-arm64.sha256",
  "dist/agent-task-linux-x64.tar.gz",
  "dist/agent-task-linux-x64.sha256",
  "dist/install.sh",
  "dist/SHA256SUMS.txt",
]

[channels.npm]
build = "bun scripts/build-npm.ts dist dist/npm"
out = "dist/npm"
packages = ["@cniska/agent-task-darwin-arm64", "@cniska/agent-task-linux-x64", "@cniska/agent-task"]
smoke = 'bash scripts/smoke.sh "$(command -v agent-task)" "$VERSION"'

[channels.homebrew]
tap = "cniska/homebrew-tap"
formula = "Formula/agent-task.rb"
credentials = ["TAP_DISPATCH_TOKEN"]
