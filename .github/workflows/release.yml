name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-check.ts "$TAG"

      - name: Check
        if: matrix.target == 'linux-x64'
        run: bun run check

      - name: Build binary
        run: bash scripts/build-compiled.sh "$RUNNER_TEMP/bin/agent-task"

      - name: Smoke test binary
        run: |
          expected="$(bun -e 'console.log(require("./package.json").version)')"
          bash scripts/smoke.sh "$RUNNER_TEMP/bin/agent-task" "$expected"

      - name: Package artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/agent-task-$TARGET.tar.gz" -C "$RUNNER_TEMP/bin" agent-task
          cd artifacts && shasum -a 256 "agent-task-$TARGET.tar.gz" > "agent-task-$TARGET.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-task-${{ matrix.target }}
          path: artifacts/

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write
      attestations: write

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Add installer
        run: cp scripts/install.sh artifacts/

      - name: Generate checksums
        run: cd artifacts && sha256sum -- *.tar.gz install.sh > SHA256SUMS.txt

      - name: Find the tag's published release
        id: existing
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG and (.draft | not)) | .html_url')"
          if [ -n "$published" ]; then
            echo "$TAG is already published at $published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.published == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/agent-task-darwin-arm64.tar.gz
            artifacts/agent-task-linux-x64.tar.gz
            artifacts/install.sh

      - name: Create the release as a draft with every file
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.published == 'false'
        run: |
          drafts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.TAG and .draft) | .id')"
          for id in $drafts; do
            echo "Deleting draft release $id, left for $TAG by an earlier run"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
            artifacts/agent-task-darwin-arm64.tar.gz \
            artifacts/agent-task-darwin-arm64.sha256 \
            artifacts/agent-task-linux-x64.tar.gz \
            artifacts/agent-task-linux-x64.sha256 \
            artifacts/install.sh \
            artifacts/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') && steps.existing.outputs.published == 'false'
        run: gh release edit "$TAG" --draft=false

      - name: Keep the release files of a dry run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run
          path: artifacts/

  npm:
    name: npm Packages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-task-*
          path: artifacts
          merge-multiple: true

      - name: Build packages
        run: bun scripts/build-npm.ts artifacts dist/npm

      - name: Pack without publishing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          for package in darwin-arm64 linux-x64 agent-task; do
            npm pack --dry-run "./dist/npm/$package"
          done

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for package in darwin-arm64 linux-x64 agent-task; do
            name=$(node -p "require('./dist/npm/$package/package.json').name")
            version=$(node -p "require('./dist/npm/$package/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "./dist/npm/$package" --access public --provenance
          done

  smoke:
    name: Registry smoke (${{ matrix.target }})
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: linux-x64
            runner: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Wait for the registry to serve the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for package in agent-task agent-task-darwin-arm64 agent-task-linux-x64; do
            for attempt in $(seq 1 12); do
              npm view "@cniska/$package@$version" version >/dev/null 2>&1 && continue 2
              sleep 10
            done
            echo "@cniska/$package@$version is not on the registry after $attempt tries"
            exit 1
          done

      - name: Install from the registry with npm and bun
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm install -g "@cniska/agent-task@${TAG#v}"
          bun add -g "@cniska/agent-task@${TAG#v}"

      - name: Smoke test each install with no runtime on PATH
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          npm_bin="$(npm prefix -g)/bin"
          bun_bin="$HOME/.bun/bin"
          PATH=/usr/bin:/bin
          if command -v node || command -v bun; then
            echo "a runtime is on PATH, so this proves nothing"
            exit 1
          fi
          bash scripts/smoke.sh "$npm_bin/agent-task" "$version"
          bash scripts/smoke.sh "$bun_bin/agent-task" "$version"

  homebrew:
    name: Bump Homebrew Formula
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch formula bump
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api --method POST repos/cniska/homebrew-tap/dispatches \
            -f event_type=formula-release \
            -f "client_payload[formula]=agent-task" \
            -f "client_payload[ref]=$TAG"
