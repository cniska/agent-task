name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app:
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: cniska/agent-ship/.github/workflows/release.yml@e6829c5fd05608274537911153aba92ef88e7d55 # v0.2.0
    with:
      app: ${{ inputs.app }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
